name: Idea or feature request
description: Suggest something that would help families keep their stories
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation, ideally from the storyteller's or the family's point of view.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How might Kinstory help?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
