name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 24
  BUILD_NUMBER: ${{ github.run_number }}
  GIT_SHA: ${{ github.sha }}

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - name: Version and changelog agree
        run: node scripts/check-version.mjs

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  integration:
    name: Integration tests (Postgres, ffmpeg, Typst)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kinstory
          POSTGRES_PASSWORD: kinstory
          POSTGRES_DB: kinstory_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kinstory" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://kinstory:kinstory@localhost:5432/kinstory_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/cache@v6
        with:
          path: .tools
          key: typst-${{ runner.os }}-${{ hashFiles('tools.json') }}
      - run: npm ci
      - run: npm run setup:typst
      - run: npm run test:integration
      - name: Render the sample book
        run: npm run render:sample -- --out sample
      - uses: actions/upload-artifact@v7
        with:
          name: sample-book
          path: sample/*.pdf
          retention-days: 14

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kinstory
          POSTGRES_PASSWORD: kinstory
          POSTGRES_DB: kinstory_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kinstory" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_E2E: postgres://kinstory:kinstory@localhost:5432/kinstory_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/cache@v6
        with:
          path: .tools
          key: typst-${{ runner.os }}-${{ hashFiles('tools.json') }}
      - run: npm ci
      - run: npm run setup:typst
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e -- --trace off
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  whisper:
    name: Transcription smoke test (whisper.cpp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Read pinned versions
        id: tools
        run: echo "whisper=$(node -p "require('./tools.json').whisperCpp")" >> "$GITHUB_OUTPUT"
      - name: Install ffmpeg and build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg cmake build-essential
      - uses: actions/cache@v6
        id: whisper-cache
        with:
          path: whisper.cpp
          key: whisper-${{ runner.os }}-${{ steps.tools.outputs.whisper }}-tiny.en
      - name: Build whisper.cpp ${{ steps.tools.outputs.whisper }}
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${{ steps.tools.outputs.whisper }}" https://github.com/ggml-org/whisper.cpp
          cd whisper.cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF
          cmake --build build -j"$(nproc)" --config Release --target whisper-cli
          bash ./models/download-ggml-model.sh tiny.en
      - run: npm ci
      - name: Transcribe a known recording through Kinstory's pipeline
        env:
          TRANSCRIBE_PROVIDER: whisper-cpp
          WHISPER_BIN: whisper.cpp/build/bin/whisper-cli
          WHISPER_MODEL: whisper.cpp/models/ggml-tiny.en.bin
          WHISPER_LANGUAGE: en
          WHISPER_THREADS: 4
        run: npx tsx scripts/smoke-whisper.ts whisper.cpp/samples/jfk.wav "ask not what your country can do for you"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [lint, unit]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/kinstory
          tags: |
            type=edge,branch=main
            type=raw,value=main-${{ github.run_number }},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: kinstory:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_NUMBER=${{ github.run_number }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker network create kin
          docker run -d --name db --network kin -e POSTGRES_USER=kinstory -e POSTGRES_PASSWORD=kinstory -e POSTGRES_DB=kinstory postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U kinstory && break; sleep 1; done
          docker run -d --name app --network kin -p 3000:3000 \
            -e DATABASE_URL=postgres://kinstory:kinstory@db:5432/kinstory -e ORIGIN=http://localhost:3000 -e SEED_DEMO=true \
            kinstory:ci
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/health && break; sleep 2; done
          curl -fsS http://localhost:3000/api/health | tee health.json
          grep -q '"status":"ok"' health.json
          grep -q '"build":"${{ github.run_number }}"' health.json
          docker exec app whisper-cli --help > /dev/null
          docker exec app typst --version
          docker exec app ffmpeg -version | head -1
          # The demo book is typeset in the background on first start.
          for i in $(seq 1 60); do docker logs app 2>&1 | grep -q '"kind":"render"' && break; sleep 2; done
          docker logs app 2>&1 | tail -20
          docker logs app 2>&1 | grep -q '"msg":"job done","id":1,"kind":"render"'
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push edge image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_NUMBER=${{ github.run_number }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
